name: Zahrati APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Zahrati-Android-Project-FIXED.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Zahrati project
        run: |
          set -e
          test -f Zahrati-Android-Project-FIXED.zip
          mkdir -p source
          unzip -o Zahrati-Android-Project-FIXED.zip -d source
          test -f source/settings.gradle
          test -f source/app/src/main/AndroidManifest.xml
          test -f source/app/src/main/assets/index.html
          test -f source/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Zahrati APK
        run: gradle --no-daemon -p source assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zahrati-debug-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
